name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for API key leaks
        run: |
          echo "🔍 Проверка на утечку API ключей..."
          LEAKED=0
          if grep -rE 'sk_[a-zA-Z0-9]{30,}' src/ 2>/dev/null | grep -v "placeholder\|example\|your"; then
            echo "❌ Найден ElevenLabs ключ в src/"; LEAKED=1
          fi
          if grep -rE 'AIza[a-zA-Z0-9_-]{35}' src/ 2>/dev/null; then
            echo "❌ Найден Google/Gemini ключ в src/"; LEAKED=1
          fi
          if grep -rE 'sk-or-v1-[a-zA-Z0-9]{60,}' src/ 2>/dev/null; then
            echo "❌ Найден OpenRouter ключ в src/"; LEAKED=1
          fi
          if [ $LEAKED -eq 1 ]; then
            echo "🚨 ДЕПЛОЙ ОСТАНОВЛЕН: убери API ключи из исходников!"
            exit 1
          fi
          echo "✅ API ключи не найдены"

      - name: Install & Build
        run: |
          npm install
          npm run build

      - name: Checkout existing gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-existing
        continue-on-error: true

      - name: Archive previous version & build manifest
        run: |
          CURRENT_VER=$(node -e "console.log(require('./package.json').version)")
          CURRENT_DATE=$(date +"%Y-%m-%d")
          REPO_NAME=$(basename $(git remote get-url origin) .git)
          SITE_BASE="/${REPO_NAME}/"
          echo "📦 Новая версия: $CURRENT_VER | base: $SITE_BASE"

          mkdir -p docs/versions

          # Копируем уже существующие архивы
          if [ -d gh-pages-existing/versions ]; then
            rsync -a --exclude='manifest.json' gh-pages-existing/versions/ docs/versions/ || true
            echo "✅ Скопированы существующие архивы"
          fi

          # Читаем предыдущий manifest
          PREV_VER=""
          PREV_DATE=""
          if [ -f gh-pages-existing/versions/manifest.json ]; then
            PREV_VER=$(node -e "try{const m=require('./gh-pages-existing/versions/manifest.json');console.log(m.current||'')}catch(e){console.log('')}")
            PREV_DATE=$(node -e "try{const m=require('./gh-pages-existing/versions/manifest.json');console.log(m.currentDate||'')}catch(e){console.log('')}")
            echo "📌 Предыдущая: $PREV_VER ($PREV_DATE)"
          fi

          # Архивируем предыдущий билд если версия изменилась
          if [ -n "$PREV_VER" ] && [ "$PREV_VER" != "$CURRENT_VER" ]; then
            echo "📦 Архивируем v$PREV_VER"
            mkdir -p "docs/versions/$PREV_VER"
            if [ -d gh-pages-existing ]; then
              rsync -a --exclude='versions' --exclude='.nojekyll' \
                gh-pages-existing/ "docs/versions/$PREV_VER/" || true
            fi

            # ── ИСПРАВЛЕНИЕ 404: патчим index.html архивной версии ──────────
            # Vite билд использует ./assets/... — из подпапки /versions/X.X.X/
            # эти пути ломаются. Добавляем <base href> чтобы браузер искал
            # assets от корня архивной папки, а не от текущего URL.
            ARCHIVE_INDEX="docs/versions/$PREV_VER/index.html"
            if [ -f "$ARCHIVE_INDEX" ]; then
              BASE_HREF="${SITE_BASE}versions/${PREV_VER}/"
              # Вставляем <base href="..."> сразу после <head>
              sed -i "s|<head>|<head><base href=\"${BASE_HREF}\">|" "$ARCHIVE_INDEX"
              echo "✅ Пропатчен index.html для v$PREV_VER: base href = $BASE_HREF"
            fi
          fi

          # Строим manifest.json
          node -e "
            const fs = require('fs');
            const MAX_ARCHIVED = 10;
            let archived = [];

            const versionsDir = 'docs/versions';
            if (fs.existsSync(versionsDir)) {
              const entries = fs.readdirSync(versionsDir, { withFileTypes: true });
              for (const e of entries) {
                if (e.isDirectory()) {
                  archived.push({ id: e.name, label: e.name, date: '', path: 'versions/' + e.name + '/' });
                }
              }
            }

            const prevPath = 'gh-pages-existing/versions/manifest.json';
            if (fs.existsSync(prevPath)) {
              const prev = JSON.parse(fs.readFileSync(prevPath, 'utf8'));
              for (const a of archived) {
                const found = (prev.versions || []).find(v => v.id === a.id);
                if (found) { a.label = found.label; a.date = found.date; }
                if (a.id === prev.current && prev.currentDate) a.date = prev.currentDate;
              }
            }

            archived.sort((a, b) => b.id.localeCompare(a.id));
            const toRemove = archived.slice(MAX_ARCHIVED);
            archived = archived.slice(0, MAX_ARCHIVED);
            for (const r of toRemove) {
              const p = 'docs/versions/' + r.id;
              if (fs.existsSync(p)) fs.rmSync(p, { recursive: true });
              console.log('🗑 Удалена старая версия:', r.id);
            }

            const manifest = {
              current: '$CURRENT_VER',
              currentLabel: '$CURRENT_VER',
              currentDate: '$CURRENT_DATE',
              versions: archived
            };
            fs.writeFileSync('docs/versions/manifest.json', JSON.stringify(manifest, null, 2));
            console.log('📋 manifest:', JSON.stringify(manifest, null, 2));
          "

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: .
          keep_files: false

      - name: Summary
        run: |
          CURRENT_VER=$(node -e "console.log(require('./package.json').version)")
          echo "## ✅ Задеплоено v$CURRENT_VER" >> $GITHUB_STEP_SUMMARY
          echo "🌐 https://cinelife.github.io/uztranscribe" >> $GITHUB_STEP_SUMMARY
