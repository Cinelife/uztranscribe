<body>

<h1>⚡ experiment4 — dispatchMarker</h1>
<p class="sub">RMS micro-segs → [seg₁+marker+seg₂+…] → один WAV → один Gemini запрос</p>

<!-- ── Аудио ── -->
<div class="section">

        <tr>
          <th>#</th><th>Start</th><th>End</th><th>Dur</th><th>Текст Gemini</th><th>Статус</th>
        </tr>

<script>
// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let audioBuf = null
let flagMap  = null   // Map<flagId, {start,end,type}>
let markerWavBlob = null
let lastTexts = null
let lastSrt   = null

// ══════════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id)
const logEl = $('log')

function addLog(msg, cls='') {
  const ts  = new Date().toTimeString().slice(0,8)
  const div = document.createElement('div')
  div.className = cls
  div.textContent = `[${ts}] ${msg}`
  logEl.appendChild(div)
  logEl.scrollTop = logEl.scrollHeight
}

function fmt(ms) { return ms >= 1000 ? (ms/1000).toFixed(1)+'с' : ms+'мс' }

// Слайдеры
const sliders = [
  ['minPause',   v => `${v}мс`,          'vMinPause'],
  ['minDur',     v => `${(v/1000).toFixed(1)}с`, 'vMinDur'],
  ['maxDur',     v => `${(v/1000).toFixed(1)}с`, 'vMaxDur'],
  ['rmsThresh',  v => `${parseFloat(v).toFixed(3)}`, 'vRmsThresh'],
  ['bufMs',      v => `${v}мс`,          'vBufMs'],
  ['markerHz',   v => `${v}Гц`,          'vMarkerHz'],
  ['markerMs',   v => `${v}мс`,          'vMarkerMs'],
  ['markerAmp',  v => `${parseFloat(v).toFixed(2)}`, 'vMarkerAmp'],
]
sliders.forEach(([id, fmt, vid]) => {
  const el = $(id)
  $(vid).textContent = fmt(el.value)
  el.addEventListener('input', () => { $(vid).textContent = fmt(el.value) })
})

// ══════════════════════════════════════════════════════════════
//  FILE DROP
// ══════════════════════════════════════════════════════════════
const drop = $('drop')
const fileInput = $('fileInput')
drop.addEventListener('click',      () => fileInput.click())
drop.addEventListener('dragover',   e => { e.preventDefault(); drop.classList.add('over') })
drop.addEventListener('dragleave',  () => drop.classList.remove('over'))
drop.addEventListener('drop',       e => { e.preventDefault(); drop.classList.remove('over'); loadFile(e.dataTransfer.files[0]) })
fileInput.addEventListener('change',() => loadFile(fileInput.files[0]))

async function loadFile(file) {
  if (!file) return
  addLog(`Загрузка: ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`, 'dm')
  const t0 = performance.now()
  try {
    const ab  = await file.arrayBuffer()
    const ctx = new AudioContext()
    audioBuf  = await ctx.decodeAudioData(ab)
    ctx.close()
    const ms  = Math.round(performance.now() - t0)
    drop.textContent = `✓ ${file.name} | ${audioBuf.duration.toFixed(1)}с | ${audioBuf.sampleRate}Гц | ${audioBuf.numberOfChannels}ch`
    drop.className   = 'drop loaded'
    addLog(`✓ Декодировано: ${audioBuf.duration.toFixed(1)}с | ${fmt(ms)}`, 'ok')
    drawWaveform(audioBuf)
    $('btnSegment').disabled = false
    flagMap = null; markerWavBlob = null; lastTexts = null; lastSrt = null
    $('btnDispatch').disabled    = true
    $('btnDownloadWav').disabled = true
    $('btnDownloadSrt').disabled = true
  } catch(e) {
    addLog(`✗ Ошибка декодирования: ${e.message}`, 'er')
  }
}

function drawWaveform(buf) {
  const canvas = $('waveCanvas')
  canvas.style.display = 'block'
  canvas.width  = canvas.offsetWidth
  canvas.height = 60
  const ctx  = canvas.getContext('2d')
  const data = buf.getChannelData(0)
  const step = Math.floor(data.length / canvas.width)
  ctx.fillStyle = '#010409'
  ctx.fillRect(0, 0, canvas.width, canvas.height)
  ctx.strokeStyle = '#1f6feb'
  ctx.beginPath()
  for (let x = 0; x < canvas.width; x++) {
    let max = 0
    for (let j = 0; j < step; j++) max = Math.max(max, Math.abs(data[x*step+j]||0))
    const h = max * canvas.height * 0.9
    ctx.moveTo(x, canvas.height/2 - h/2)
    ctx.lineTo(x, canvas.height/2 + h/2)
  }
  ctx.stroke()
}

// ══════════════════════════════════════════════════════════════
//  RMS SEGMENTER
// ══════════════════════════════════════════════════════════════
function rmsSegmenter(audioBuf, { minPauseMs, minDurMs, maxDurMs, threshold, bufMs }) {
  const sr     = audioBuf.sampleRate
  const ch     = audioBuf.getChannelData(0)
  const FRAME  = Math.floor(sr * 0.01)   // 10мс фреймы
  const nF     = Math.floor(ch.length / FRAME)

  // 1. RMS per frame
  const rms = new Float32Array(nF)
  for (let f = 0; f < nF; f++) {
    let sum = 0
    const off = f * FRAME
    for (let i = 0; i < FRAME; i++) sum += ch[off+i]**2
    rms[f] = Math.sqrt(sum / FRAME)
  }

  // 2. Speech frames
  const speech = rms.map(v => v > threshold)

  // 3. Merge: fill small silence gaps (< minPause)
  const minPF = Math.ceil(minPauseMs / 10)
  let i = 0
  while (i < speech.length) {
    if (!speech[i]) {
      let j = i
      while (j < speech.length && !speech[j]) j++
      if (j - i < minPF) for (let k = i; k < j; k++) speech[k] = true
      i = j
    } else i++
  }

  // 4. Extract raw speech regions
  const regions = []
  let inSeg = false, segStart = 0
  for (let f = 0; f < speech.length; f++) {
    if (!inSeg && speech[f])  { inSeg = true; segStart = f }
    if (inSeg  && !speech[f]) { inSeg = false; regions.push([segStart, f]) }
  }
  if (inSeg) regions.push([segStart, speech.length])

  // 5. Convert to seconds with buf, split long, drop short
  const bufF    = Math.floor(bufMs / 10)
  const minDurF = Math.ceil(minDurMs / 10)
  const maxDurF = Math.floor(maxDurMs / 10)
  const segs    = []
  let flagId    = 0

  for (const [a, b] of regions) {
    const s0 = Math.max(0, a - bufF)
    const s1 = Math.min(nF - 1, b + bufF)
    const dur = s1 - s0
    if (dur < minDurF) continue

    if (dur <= maxDurF) {
      segs.push({ flagId: flagId++, start: s0*FRAME/sr, end: s1*FRAME/sr, type: 'speech' })
    } else {
      // Разбить на куски <= maxDur
      let cur = s0
      while (cur < s1) {
        const end = Math.min(cur + maxDurF, s1)
        segs.push({ flagId: flagId++, start: cur*FRAME/sr, end: end*FRAME/sr, type: 'speech' })
        cur = end
      }
    }
  }

  return segs
}

// ══════════════════════════════════════════════════════════════
//  WAV ENCODER
// ══════════════════════════════════════════════════════════════
function pcmToWav(samples, sampleRate) {
  const len   = samples.length
  const buf   = new ArrayBuffer(44 + len * 2)
  const view  = new DataView(buf)
  const int16 = new Int16Array(buf, 44)
  for (let i = 0; i < len; i++) int16[i] = Math.max(-32768, Math.min(32767, Math.round(samples[i] * 32767)))
  const set = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off+i, str.charCodeAt(i)) }
  set(0,'RIFF'); view.setUint32(4, 36+len*2, true)
  set(8,'WAVE'); set(12,'fmt ')
  view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true)
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true)
  view.setUint16(32,2,true); view.setUint16(34,16,true)
  set(36,'data'); view.setUint32(40,len*2,true)
  return new Blob([buf], {type:'audio/wav'})
}

function slicePCM(audioBuf, t0, t1) {
  const sr  = audioBuf.sampleRate
  const ch  = audioBuf.getChannelData(0)
  const s   = Math.max(0, Math.floor(t0 * sr))
  const e   = Math.min(ch.length, Math.ceil(t1 * sr))
  return ch.slice(s, e)
}

function generateMarkerPCM(sampleRate, hz, durationMs, amplitude) {
  const n   = Math.floor(sampleRate * durationMs / 1000)
  const out = new Float32Array(n)
  for (let i = 0; i < n; i++) out[i] = amplitude * Math.sin(2*Math.PI*hz*i/sampleRate)
  // Fade in/out 10мс
  const fade = Math.floor(sampleRate * 0.01)
  for (let i = 0; i < Math.min(fade, n); i++) {
    out[i] *= i/fade
    out[n-1-i] *= i/fade
  }
  return out
}

function concatFloat32(arrays) {
  const total = arrays.reduce((s,a) => s+a.length, 0)
  const out   = new Float32Array(total)
  let off = 0
  for (const a of arrays) { out.set(a, off); off += a.length }
  return out
}

function blobToBase64(blob) {
  return new Promise((res,rej) => {
    const r = new FileReader()
    r.onload  = () => res(r.result.split(',')[1])
    r.onerror = rej
    r.readAsDataURL(blob)
  })
}

// ══════════════════════════════════════════════════════════════
//  BUILD MARKER WAV
// ══════════════════════════════════════════════════════════════
function buildMarkerWav(audioBuf, segs) {
  const sr     = audioBuf.sampleRate
  const hz     = parseInt($('markerHz').value)
  const ms     = parseInt($('markerMs').value)
  const amp    = parseFloat($('markerAmp').value)
  const marker = generateMarkerPCM(sr, hz, ms, amp)

  const parts = []
  for (let i = 0; i < segs.length; i++) {
    parts.push(slicePCM(audioBuf, segs[i].start, segs[i].end))
    if (i < segs.length - 1) parts.push(marker)
  }

  const combined = concatFloat32(parts)
  return pcmToWav(combined, sr)
}

// ══════════════════════════════════════════════════════════════
//  PROMPT BUILDER
// ══════════════════════════════════════════════════════════════
function buildMarkerPrompt(segs, lang) {
  const LANG_MAP = { uz:'Uzbek', ru:'Russian', kk:'Kazakh', en:'English', tr:'Turkish' }
  const langName = LANG_MAP[lang] || lang
  const n        = segs.length
  const hz       = $('markerHz').value
  const msDur    = $('markerMs').value

  const list = segs.map((s, i) =>
    `  ${i+1}. ${s.start.toFixed(2)}s – ${s.end.toFixed(2)}s (duration: ${(s.end-s.start).toFixed(2)}s)`
  ).join('\n')

  return (
    `Transcribe this ${langName} audio. It contains ${n} speech segments separated by short ${hz}Hz sine-wave marker tones (${msDur}ms each).\n\n` +
    `IMPORTANT: The ${hz}Hz marker tones are NOT speech — they are separator signals. Completely IGNORE them.\n\n` +
    `Each segment's original timestamp in the source audio:\n` +
    list + '\n\n' +
    `Rules:\n` +
    `- Transcribe each segment independently\n` +
    `- Use full linguistic intelligence for ${langName}: correct names, abbreviations, terminology\n` +
    (lang === 'uz' ? `- Write Uzbek in Latin script (a b d e f g h i j k l m n o p q r s t u v x y z + apostrophe)\n` : '') +
    `- Return ONLY a JSON array of exactly ${n} strings, one per segment\n` +
    `- Empty string "" for inaudible segments\n` +
    `- No timestamps, no explanations, no markdown — raw JSON array only\n\n` +
    `Example output: ["text segment 1", "text segment 2", "text segment 3"]`
  )
}

// ══════════════════════════════════════════════════════════════
//  GEMINI CALL
// ══════════════════════════════════════════════════════════════
async function callGeminiMarker(apiKey, b64wav, segs, lang, model) {
  const prompt   = buildMarkerPrompt(segs, lang)
  const n        = segs.length
  const totalDur = segs[segs.length-1].end - segs[0].start

  addLog(`  Промт: ${prompt.length} символов`, 'gr')
  addLog(`  Сегментов: ${n} | общая дур: ${totalDur.toFixed(1)}с`, 'gr')

  const body = {
    contents: [{
      role: 'user',
      parts: [
        { inline_data: { mime_type: 'audio/wav', data: b64wav } },
        { text: prompt }
      ]
    }],
    generationConfig: {
      temperature: 0,
      maxOutputTokens: Math.max(2048, n * 40),
      responseMimeType: 'application/json'
    }
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`
  const t0  = performance.now()
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  const apiMs = Math.round(performance.now() - t0)

  if (!res.ok) {
    const err = await res.text()
    throw new Error(`HTTP ${res.status}: ${err.slice(0,200)}`)
  }

  const data = await res.json()
  addLog(`  API: ${fmt(apiMs)} | HTTP 200`, 'ok')

  // Parse response
  const raw = (data.candidates?.[0]?.content?.parts || []).map(p => p.text||'').join('').trim()
  addLog(`  Raw response (${raw.length} chars): ${raw.slice(0,120)}${raw.length>120?'…':''}`, 'gr')

  let parsed
  try {
    let s = raw
    if (s.includes('```')) { s = s.split('```')[1]||''; if (s.startsWith('json')) s = s.slice(4) }
    parsed = JSON.parse(s.trim())
  } catch(_) {
    const m = raw.match(/\[[\s\S]*\]/)
    if (m) { try { parsed = JSON.parse(m[0]) } catch(_) { throw new Error('JSON parse fail') } }
    else throw new Error('JSON parse fail: ' + raw.slice(0,100))
  }

  if (!Array.isArray(parsed)) throw new Error('Response is not array')
  addLog(`  Получено ${parsed.length} строк (ожидали ${n})`, parsed.length === n ? 'ok' : 'wa')
  return parsed
}

// ══════════════════════════════════════════════════════════════
//  BUTTON: SEGMENT
// ══════════════════════════════════════════════════════════════
$('btnSegment').addEventListener('click', async () => {
  if (!audioBuf) return
  $('btnSegment').disabled = true
  addLog('── Сегментирование ──', 'pu')
  const t0 = performance.now()

  try {
    const segs = rmsSegmenter(audioBuf, {
      minPauseMs: parseInt($('minPause').value),
      minDurMs:   parseInt($('minDur').value),
      maxDurMs:   parseInt($('maxDur').value),
      threshold:  parseFloat($('rmsThresh').value),
      bufMs:      parseInt($('bufMs').value),
    })

    // Build flagMap
    flagMap = new Map()
    for (const s of segs) flagMap.set(s.flagId, s)

    const ms     = Math.round(performance.now() - t0)
    const total  = audioBuf.duration
    const covered = segs.reduce((s, seg) => s + (seg.end - seg.start), 0)

    addLog(`✓ Сегментов: ${segs.length} | покрытие: ${covered.toFixed(1)}с / ${total.toFixed(1)}с | ${fmt(ms)}`, 'ok')
    segs.forEach(s => addLog(`  [${s.flagId}] ${s.start.toFixed(2)}–${s.end.toFixed(2)}с (${(s.end-s.start).toFixed(2)}с)`, 'gr'))

    // Build marker WAV
    addLog('Сборка WAV с маркерами...', 'dm')
    const wavT0 = performance.now()
    markerWavBlob = buildMarkerWav(audioBuf, segs)
    const wavMs   = Math.round(performance.now() - wavT0)
    addLog(`✓ WAV собран: ${(markerWavBlob.size/1024).toFixed(0)}KB | ${fmt(wavMs)}`, 'ok')

    $('btnDispatch').disabled    = false
    $('btnDownloadWav').disabled = false
  } catch(e) {
    addLog(`✗ Ошибка: ${e.message}`, 'er')
  }
  $('btnSegment').disabled = false
})

// ══════════════════════════════════════════════════════════════
//  BUTTON: DISPATCH
// ══════════════════════════════════════════════════════════════
$('btnDispatch').addEventListener('click', async () => {
  if (!flagMap || !markerWavBlob) return
  const apiKey = $('apiKey').value.trim()
  if (!apiKey) { addLog('✗ Нет API ключа', 'er'); return }

  $('btnDispatch').disabled = true
  addLog('── dispatchMarker ──', 'pu')
  const t0 = performance.now()

  try {
    const segs = Array.from(flagMap.values()).sort((a,b) => a.start - b.start)

    addLog(`Конвертация WAV→base64 (${(markerWavBlob.size/1024).toFixed(0)}KB)...`, 'dm')
    const b64  = await blobToBase64(markerWavBlob)
    const b64Ms = Math.round(performance.now() - t0)
    addLog(`✓ base64 готов: ${(b64.length/1024).toFixed(0)}KB | ${fmt(b64Ms)}`, 'ok')

    addLog(`Вызов Gemini (${$('model').value})...`, 'dm')
    const texts = await callGeminiMarker(apiKey, b64, segs, $('lang').value, $('model').value)
    const totalMs = Math.round(performance.now() - t0)

    // Zip texts с flagMap
    lastTexts = new Map()
    segs.forEach((s, i) => lastTexts.set(s.flagId, texts[i] || ''))

    addLog(`✓ dispatchMarker итого: ${fmt(totalMs)}`, 'ok')

    // Build SRT
    lastSrt = buildSrt(segs, lastTexts)
    $('btnDownloadSrt').disabled = false

    // Show results table
    showResults(segs, texts, totalMs)
  } catch(e) {
    addLog(`✗ Ошибка: ${e.message}`, 'er')
    console.error(e)
  }
  $('btnDispatch').disabled = false
})

// ══════════════════════════════════════════════════════════════
//  RESULTS TABLE
// ══════════════════════════════════════════════════════════════
function showResults(segs, texts, totalMs) {
  const n     = segs.length
  const got   = texts.length
  const empty = texts.filter(t => !t?.trim()).length
  const ok    = got - empty

  $('statsLine').innerHTML = `
    <span class="badge b-ok">${n} сег</span>&nbsp;
    <span class="badge ${got===n?'b-ok':'b-wa'}">${got} текстов${got!==n?' ≠ '+n:''}</span>&nbsp;
    <span class="badge b-ok">${ok} непустых</span>&nbsp;
    <span class="badge b-wa">${empty} пустых</span>&nbsp;
    <span class="badge b-ok">⏱ ${fmt(totalMs)}</span>
  `

  const tbody = $('resultsTbody')
  tbody.innerHTML = ''

  for (let i = 0; i < n; i++) {
    const s   = segs[i]
    const txt = (texts[i] || '').trim()
    const dur = (s.end - s.start).toFixed(2)
    const ok  = txt.length > 0
    const tr  = document.createElement('tr')
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${s.start.toFixed(2)}</td>
      <td>${s.end.toFixed(2)}</td>
      <td>${dur}с</td>
      <td style="max-width:400px;word-break:break-word">${txt || '<span style="color:#8b949e">—</span>'}</td>
      <td><span class="badge ${ok?'b-ok':'b-wa'}">${ok?'✓':'пусто'}</span></td>
    `
    tbody.appendChild(tr)
  }

  $('resultsWrap').style.display = 'block'
}

// ══════════════════════════════════════════════════════════════
//  SRT BUILDER
// ══════════════════════════════════════════════════════════════
function toSrtTime(s) {
  const h  = Math.floor(s/3600)
  const m  = Math.floor((s%3600)/60)
  const ss = Math.floor(s%60)
  const ms = Math.round((s%1)*1000)
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')},${String(ms).padStart(3,'0')}`
}

function buildSrt(segs, textMap) {
  let srt = '', n = 0
  for (const s of segs) {
    const txt = (textMap.get(s.flagId) || '').trim()
    if (!txt) continue
    n++
    srt += `${n}\n${toSrtTime(s.start)} --> ${toSrtTime(s.end)}\n${txt}\n\n`
  }
  return srt
}

// ══════════════════════════════════════════════════════════════
//  BUTTONS: DOWNLOAD
// ══════════════════════════════════════════════════════════════
$('btnDownloadWav').addEventListener('click', () => {
  if (!markerWavBlob) return
  const url = URL.createObjectURL(markerWavBlob)
  const a   = document.createElement('a')
  a.href    = url; a.download = 'marker_test.wav'; a.click()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
  addLog('⬇ WAV скачан', 'dm')
})

$('btnDownloadSrt').addEventListener('click', () => {
  if (!lastSrt) return
  const blob = new Blob([lastSrt], {type:'text/plain'})
  const url  = URL.createObjectURL(blob)
  const a    = document.createElement('a')
  a.href = url; a.download = 'dispatchMarker.srt'; a.click()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
  addLog('⬇ SRT скачан', 'ok')
})

$('btnClear').addEventListener('click', () => {
  logEl.innerHTML = ''
  $('resultsWrap').style.display = 'none'
})

addLog('experiment4 готов — dispatchMarker тест', 'ok')
addLog('Алгоритм: RMS micro-segs → [seg+marker+seg+…] → 1 WAV → 1 Gemini запрос', 'gr')
</script>
</body>
